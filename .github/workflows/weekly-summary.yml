name: Weekly summary

# 임박한 학회 마감과 이번 주 랩 일정을 Slack에 올립니다.
#
# ⚠️ 과제(Grant) 마감은 담지 않습니다. Slack 채널의 구성원을 이 워크플로가
#    알 수 없기 때문입니다 — 자세한 이유는 scripts/weekly-slack-summary.mjs 주석 참고.
#
# SLACK_WEBHOOK_URL 시크릿이 없으면 요약을 로그에만 남기고 성공합니다.
# 시크릿을 넣기 전에도 워크플로가 초록색이어야 무슨 일이 나는지 볼 수 있습니다.

on:
  schedule:
    # 일 22:00 UTC = 월 07:00 KST. 출근 전에 도착합니다.
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summarize:
    name: 주간 요약
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 요약 생성 · 포스팅
        run: node scripts/weekly-slack-summary.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 공개 캘린더 주소. 비공개 캘린더를 요약에 넣고 싶으면
          # config/calendars.yaml 의 env_var 이름대로 시크릿을 추가하세요.
          GCAL_ICAL_SEMINARS: ${{ secrets.GCAL_ICAL_SEMINARS }}
