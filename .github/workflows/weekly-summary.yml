name: Weekly summary

# 이번 주 랩 일정과 임박한 학회 마감을 Slack에 올립니다.
#
# ⚠️ 이 워크플로는 **Webhook 채널이 랩 내부 전용(학생 + PI)** 이라는 전제 위에
#    돌아갑니다. 랩 일정 제목에는 미팅 상대 이름이 그대로 들어갑니다.
#    채널을 alumni·외부 협력자가 있는 곳으로 옮긴다면 먼저
#    scripts/weekly-slack-summary.mjs 의 헤더 주석을 읽어 보세요.
#
# ⚠️ 과제(Grant) 마감은 담지 않습니다 — /internal/deadlines 에서 봅니다.
#
# SLACK_WEBHOOK_URL 시크릿이 없으면 요약을 로그에만 남기고 성공합니다.
# 시크릿을 넣기 전에도 워크플로가 초록색이어야 무슨 일이 나는지 볼 수 있습니다.
#
# ⚠️ 실행 시각 로깅 (관찰용, 2026-09-10 도입)
#    2026-09-09 실행이 예정(09:23 KST)보다 4시간29분 늦게 트리거됐습니다. 패턴인지
#    일회성인지 보려고 매 실행마다 예정 vs 실제 트리거 시각을 Actions 로그에
#    남깁니다(Slack 메시지에는 안 넣습니다 — scripts/weekly-slack-summary.mjs의
#    logRunTiming() 참고). "실행 시각 조회" 스텝이 이 워크플로 실행 자체의
#    run_started_at을 API로 조회해 넘깁니다 — GitHub Actions 러너에 이 값이
#    기본 env로 주어지지 않기 때문입니다 (있는 건 GITHUB_RUN_ID뿐).
#    2~4주 데이터가 쌓이면 이 로그로 외부 cron 서비스 도입 여부를 판단합니다.
#
#    env 이름이 WEEKLY_SUMMARY_RUN_STARTED_AT인 이유: `GITHUB_` 접두어는 GitHub가
#    예약해 둬서 워크플로 env로 직접 설정할 수 없습니다(설정 자체가 유효성 검사
#    오류) — GITHUB_RUN_STARTED_AT을 그대로 쓰면 안 됩니다.

on:
  schedule:
    # 주 2회, 둘 다 오전 9시대 KST (UTC+9, 한국은 DST 없음).
    #
    # ⚠️ 분(:37, :23)이 어중간한 것은 의도입니다. 매시 정각에 예약 워크플로가
    #    몰려 지연·skip 된다고 GitHub 이 공식 문서에서 밝히고 있고, 실제로 이
    #    저장소의 첫 예약 실행(2026-09-07 00:00 UTC)이 통째로 skip 됐습니다.
    #    :00 / :15 / :30 / :45 로 되돌리지 마세요.
    #
    # 월 00:37 UTC = 월 09:37 KST — 한 주 시작. Sync(월 09:23 KST) 뒤 14분 버퍼를
    #   두어 갱신된 학회 캐시를 보게 합니다. 다만 GitHub 예약 지연 때문에 순서가
    #   보장되지는 않습니다 — sync-conferences.yml 의 주석 참고.
    - cron: '37 0 * * 1'
    # 수 00:23 UTC = 수 09:23 KST — 주 중간 리마인더.
    #   학회 캐시는 월요일 것을 그대로 씁니다 (수요일에는 Sync 를 돌리지 않습니다).
    - cron: '23 0 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  # 아래 "실행 시각 조회" 스텝이 이 워크플로 실행의 run_started_at을 API로
  # 읽는 데 필요합니다. 그 외에는 쓰지 않습니다.
  actions: read

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summarize:
    name: 주간 요약
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # schedule 실행에서만 의미가 있습니다. API 호출이 실패해도(권한 문제 등)
      # 워크플로를 세우지 않습니다 — 이 값은 관찰용 로그일 뿐이라 없으면
      # scripts/weekly-slack-summary.mjs가 그 사실만 남기고 넘어갑니다.
      - name: 실행 시각 조회
        id: run_info
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq .run_started_at || true)
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

      - name: 요약 생성 · 포스팅
        run: node scripts/weekly-slack-summary.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # schedule 이벤트를 트리거한 cron 표현식 그 자체(예: '23 0 * * 3').
          # 이 워크플로에 cron이 두 개(월/수)라 "예정 시각"이 하나로 고정되지
          # 않으므로, 실제로 매치된 것을 GitHub이 알려주는 이 값을 씁니다.
          WEEKLY_SUMMARY_CRON: ${{ github.event.schedule }}
          WEEKLY_SUMMARY_RUN_STARTED_AT: ${{ steps.run_info.outputs.started_at }}
          # 랩 공식 캘린더의 iCal 주소.
          #
          # 이 job 은 사이트를 빌드하지 않습니다 — 읽어서 Slack 에 보내기만 하고
          # dist/ 를 만들지 않으므로, 여기서 캘린더를 넘겨도 공개 배포본과는
          # 무관합니다. (배포는 deploy.yml 이고 거기서는 캘린더를 넘기지 않으며,
          # PUBLIC_ONLY=1 이라 gcal.ts 가 읽지도 않습니다.)
          #
          # 시크릿이 없으면 일정 0건으로 학회 마감만 올라갑니다 — 워크플로는 성공합니다.
          GCAL_ICAL_LAB_GENERAL: ${{ secrets.GCAL_ICAL_LAB_GENERAL }}
