name: Weekly summary

# 이번 주 랩 일정과 임박한 학회 마감을 Slack에 올립니다.
#
# ⚠️ 이 워크플로는 **Webhook 채널이 랩 내부 전용(학생 + PI)** 이라는 전제 위에
#    돌아갑니다. 랩 일정 제목에는 미팅 상대 이름이 그대로 들어갑니다.
#    채널을 alumni·외부 협력자가 있는 곳으로 옮긴다면 먼저
#    scripts/weekly-slack-summary.mjs 의 헤더 주석을 읽어 보세요.
#
# ⚠️ 과제(Grant) 마감은 담지 않습니다 — /internal/deadlines 에서 봅니다.
#
# SLACK_WEBHOOK_URL 시크릿이 없으면 요약을 로그에만 남기고 성공합니다.
# 시크릿을 넣기 전에도 워크플로가 초록색이어야 무슨 일이 나는지 볼 수 있습니다.

on:
  schedule:
    # 주 2회, 둘 다 오전 9시대 KST (UTC+9, 한국은 DST 없음).
    #
    # 월 00:15 UTC = 월 09:15 KST — 한 주 시작. Sync(월 09:00 KST) 뒤 15분 버퍼를
    #   두어 갱신된 학회 캐시를 보게 합니다. 다만 GitHub 예약 지연 때문에 순서가
    #   보장되지는 않습니다 — sync-conferences.yml 의 주석 참고.
    - cron: '15 0 * * 1'
    # 수 00:00 UTC = 수 09:00 KST — 주 중간 리마인더.
    #   학회 캐시는 월요일 것을 그대로 씁니다 (수요일에는 Sync 를 돌리지 않습니다).
    - cron: '0 0 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summarize:
    name: 주간 요약
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 요약 생성 · 포스팅
        run: node scripts/weekly-slack-summary.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 랩 공식 캘린더의 iCal 주소.
          #
          # 이 job 은 사이트를 빌드하지 않습니다 — 읽어서 Slack 에 보내기만 하고
          # dist/ 를 만들지 않으므로, 여기서 캘린더를 넘겨도 공개 배포본과는
          # 무관합니다. (배포는 deploy.yml 이고 거기서는 캘린더를 넘기지 않으며,
          # PUBLIC_ONLY=1 이라 gcal.ts 가 읽지도 않습니다.)
          #
          # 시크릿이 없으면 일정 0건으로 학회 마감만 올라갑니다 — 워크플로는 성공합니다.
          GCAL_ICAL_LAB_GENERAL: ${{ secrets.GCAL_ICAL_LAB_GENERAL }}
