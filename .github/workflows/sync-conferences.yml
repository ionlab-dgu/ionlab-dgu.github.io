name: Sync conferences

# 학회 데드라인을 aideadlines에서 받아와 src/data/conferences-fetched.json 을 갱신합니다.
#
# 사이트 빌드는 이 JSON만 읽습니다 — 빌드 시점에 네트워크를 타지 않으므로
# upstream이 죽어도 배포는 멈추지 않습니다 (CLAUDE.md §4).
#
# ⚠️ 여기서 GITHUB_TOKEN 으로 push한 커밋은 다른 워크플로를 트리거하지 않습니다
#    (GitHub Actions의 재귀 방지 규칙). 즉 이 커밋만으로는 배포가 돌지 않고,
#    다음 사람 푸시나 Deploy 수동 실행 때 사이트에 반영됩니다.
#    데드라인은 하루 이틀 늦어도 되는 정보라 이대로 둡니다.

on:
  schedule:
    # 월 00:23 UTC = 월 09:23 KST.
    # 14분 뒤 주간 요약(월 09:37 KST)이 갱신된 캐시를 보도록 앞에 둡니다.
    #
    # ⚠️ 정각(:00)을 피해 :23 에 둔 것은 의도입니다. GitHub 는 매시 정각에 예약
    #    워크플로가 몰린다고 공식 문서에서 밝히고 있고, 실제로 이 저장소의
    #    첫 예약 실행(2026-09-07 00:00 UTC)이 통째로 skip 됐습니다.
    #    :00 / :15 / :30 / :45 같은 관행적인 분으로 되돌리지 마세요.
    #
    # ⚠️ 그래도 순서가 보장되지는 않습니다. 부하가 몰리면 수십 분씩 밀립니다
    #    (UTC 00 시대는 여전히 붐비는 시간대입니다). 순서가 뒤바뀌면 그 주 요약이
    #    지난주 캐시를 씁니다 — 학회 마감은 자주 바뀌지 않아 실질 영향이 작다고
    #    보고 이대로 둡니다.
    #    확실히 하려면 요약을 workflow_run(이 워크플로 완료 후)으로 걸면 됩니다.
    - cron: '23 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write # 갱신된 캐시를 커밋합니다

concurrency:
  group: sync-conferences
  cancel-in-progress: false

jobs:
  sync:
    name: 데드라인 수집
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # upstream 장애 시에도 exit 0 입니다 (기존 캐시를 그대로 둡니다).
      - name: 학회 데드라인 수집
        run: node scripts/fetch-conferences.mjs

      # 자동 생성 파일 하나만 커밋합니다. 다른 변경이 섞이면 커밋하지 않습니다.
      - name: 변경분 커밋
        run: |
          if git diff --quiet -- src/data/conferences-fetched.json; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/conferences-fetched.json
          git commit -m "chore(conferences): sync deadlines from aideadlines

          scripts/fetch-conferences.mjs 가 자동 생성한 커밋입니다."
          git push
