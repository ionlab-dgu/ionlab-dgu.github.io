# 관심 학회 데드라인 — 우리가 실제로 낼 곳만.
#
# 이 파일은 세 부분입니다:
#   1. tracked_venues — 자동 수집 대상 venue 목록 (사람이 고르고, 날짜는 기계가 채움)
#   2. display        — 표시 규칙
#   3. conferences    — 사람이 직접 확인해 적는 목록 (자동 수집분을 덮어씀)
#
# 시간대는 모두 AoE(Anywhere on Earth) 기준으로 적습니다.
# 대시보드는 D-30 이내를 강조 표시합니다.

# ─────────────────────────────────────────────────────────────
# 1. tracked_venues — 자동 수집 대상
#
# scripts/fetch-conferences.mjs 가 aideadlines에서 **이 목록의 venue만** 받아와
# src/data/conferences-fetched.json 에 캐시합니다. 주 1회 워크플로가 돌립니다.
#
#   source: huggingface/ai-deadlines 의 src/data/conferences/<source>.yml 파일명
#           (여기 적은 이름이 곧 URL이 됩니다. 오타가 나면 그 venue만 조용히 빠집니다.)
#
# 낼 생각이 없는 학회를 넣으면 데드라인 목록이 소음으로 채워집니다. 실제로
# 투고를 고려하는 곳만 두세요.

tracked_venues:
  # Tier 1 General ML
  - name: NeurIPS
    source: neurips
    category: ml_general
  - name: ICML
    source: icml
    category: ml_general
  - name: ICLR
    source: iclr
    category: ml_general

  # AI General
  - name: AAAI
    source: aaai
    category: ai_general
  - name: IJCAI
    source: ijcai
    category: ai_general

  # Vision
  - name: CVPR
    source: cvpr
    category: vision
  - name: ECCV
    source: eccv
    category: vision
  - name: ICCV
    source: iccv
    category: vision
  - name: WACV
    source: wacv
    category: vision
  # BMVC · EACL · SDM 은 huggingface/ai-deadlines 에 파일이 없어(2026-09 확인)
  # 자동 수집 대상에서 뺐습니다. 투고를 고려하면 아래 3. conferences 에 수동으로
  # 날짜를 적으세요. COLING 은 아래 NLP 항목에 등록돼 있지만 같은 이유로 수집되지
  # 않습니다 — 목록에 있는데 데이터가 안 오는 쪽이 더 위험합니다.

  # NLP
  - name: ACL
    source: acl
    category: nlp
  - name: EMNLP
    source: emnlp
    category: nlp
  - name: NAACL
    source: naacl
    category: nlp
  # ⚠️ COLING 은 목록에 있지만 upstream 에 파일이 없어 수집되지 않습니다
  #    (2026-09-11 확인: fetched.json 에 레코드 0건). 추적 중이라고 착각하기 쉬우니
  #    투고를 고려한다면 아래 3. conferences 에 손으로 적으세요.
  #    BMVC·EACL·SDM 도 같은 상태입니다. IMPLEMENTATION.md 13절 참고.
  - name: COLING
    source: coling
    category: nlp
  # EACL 도 BMVC와 같은 이유로 뺐습니다(업스트림에 eacl.yml 없음).

  # Theory / Stats
  - name: AISTATS
    source: aistats
    category: theory_stats
  - name: UAI
    source: uai
    category: theory_stats
  - name: COLT
    source: colt
    category: theory_stats
  - name: ALT
    source: alt
    category: theory_stats

  # Data Mining
  - name: KDD
    source: kdd
    category: data_mining
  - name: WSDM
    source: wsdm
    category: data_mining
  - name: ICDM
    source: icdm
    category: data_mining
  - name: CIKM
    source: cikm
    category: data_mining
  # SDM도 BMVC·EACL과 같은 이유로 뺐습니다(업스트림에 sdm.yml 없음).

  # Robotics
  - name: ICRA
    source: icra
    category: robotics
  - name: IROS
    source: iros
    category: robotics
  - name: RSS
    source: rss
    category: robotics
  - name: CoRL
    source: corl
    category: robotics

  # Speech / Audio
  - name: INTERSPEECH
    source: interspeech
    category: speech
  - name: ICASSP
    source: icassp
    category: speech

  # Multimedia
  - name: ACM MM
    source: acm_mm
    category: multimedia

  # Web / IR
  - name: WWW
    source: www
    category: web_ir
  - name: SIGIR
    source: sigir
    category: web_ir

# ─────────────────────────────────────────────────────────────
# 2. display — /calendar 와 /internal/deadlines 의 표시 규칙

display:
  # 지난 마감은 목록에서 감춥니다 (/internal/deadlines 는 접힌 섹션에 따로 보여줌).
  show_upcoming_only: true
  # 남은 일수가 이 값 이하로 떨어질 때마다 배지 색이 올라갑니다. 내림차순.
  highlight_days: [30, 14, 7, 3]
  # list | calendar — 지금은 list만 구현돼 있습니다.
  default_view: list
  # 학회 마감을 얼마나 앞서서까지 보여줄지 (일). 예전엔 60(내부 캘린더 하드코딩)이었고,
  # 이 값으로 통일했습니다. 화면이 보여주는 범위보다 짧게 두면 마감이 조용히 사라집니다.
  lookahead_days: 180
  # Slack 요약·내부 캘린더가 마감을 묶어 보여주는 티어 경계 (일, 오름차순).
  # 예: daysLeft=10 → urgent, daysLeft=45 → next_month. future 보다 먼 것은
  # (lookahead_days 안에 있어도) 어느 티어에도 안 들어가 표시되지 않습니다 —
  # future와 lookahead_days를 다르게 둘 필요는 보통 없어서 지금은 값이 같습니다.
  tier_thresholds:
    urgent: 14
    this_month: 30
    next_month: 60
    future: 180

# ─────────────────────────────────────────────────────────────
# 3. conferences — 사람이 직접 확인해 적는 목록
#
# 자동 수집분과 **같은 학회·같은 연도**가 여기 있으면 이쪽이 이깁니다.
# upstream이 틀렸거나 아직 안 올라온 날짜를 우리가 덮어쓰기 위한 자리입니다.
# 공식 CFP를 확인했다면 verified_by / verified_on 을 채우세요.

